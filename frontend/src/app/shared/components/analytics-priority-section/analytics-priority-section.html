<section class="analytics-section">
    <h2>Répartition par priorité</h2>
    <div class="priority-list">
        <div class="priority-card">
            <span class="priority-label">Priorité haute</span>
            <strong>{{ highPriority }}</strong>
            <small>{{ completedHighPriority }} complétés</small>
        </div>

        <div class="priority-card">
            <span class="priority-label">Priorité moyenne</span>
            <strong>{{ mediumPriority }}</strong>
            <small>{{ completedMediumPriority }} complétés</small>
        </div>

        <div class="priority-card">
            <span class="priority-label">Priorité basse</span>
            <strong>{{ lowPriority }}</strong>
            <small>{{ completedLowPriority }} complétés</small>
        </div>
    </div>
</section>
