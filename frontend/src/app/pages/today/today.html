@if(scheduleErrors.global) {
    <div class="error">
        <span>{{ scheduleErrors.global }}</span>
    </div>
}
<h3 class="todayDate">{{ today | date:'fullDate':'':'fr'}}</h3>
<app-kpi-summary
    [totalTasks]="totalTasks"
    [completedTasks]="completedTasks"
    [remainingTasks]="remainingTasks"
    [completionRate]="completionRate"
></app-kpi-summary>

<app-focus-today-card
    [focusSchedule]="scheduleFocus()"
    [getScheduleDisplay]="getScheduleDisplayForChild"
></app-focus-today-card>

<app-schedule-form-modal
    [isScheduleModalOpen]="isScheduleModalOpen"
    [scheduleErrors]="scheduleErrors"
    [modifyScheduleId]="modifyScheduleId"
    [selectedTaskId]="selectedTaskId"
    [tasks]="tasks"
    [scheduleSubmit]="scheduleSubmit"
    [repeatSchedule]="repeatSchedule"
    [scheduleDate]="scheduleDate"
    [todayDate]="today"
    [startDate]="startDate"
    [endDate]="endDate"
    [daysChosen]="daysChosen"
    [scheduleStartTime]="scheduleStartTime"
    [scheduleEndTime]="scheduleEndTime"
    [schedulePriority]="schedulePriority"
    (selectedTaskIdChange)="selectedTaskId = $event"
    (scheduleDateChange)="scheduleDate = $event"
    (startDateChange)="startDate = $event"
    (endDateChange)="endDate = $event"
    (scheduleStartTimeChange)="scheduleStartTime = $event"
    (scheduleEndTimeChange)="scheduleEndTime = $event"
    (schedulePriorityChange)="schedulePriority = $event"
    (saveSchedule)="saveSchedule()"
    (toggleRepeatSchedule)="toggleRepeatSchedule()"
    (toggleDay)="toggleDay($event)"
    (setScheduleModalState)="setScheduleModalState($event)"
></app-schedule-form-modal>

<app-schedule-action-modal
    [isDeleteModalOpen]="isDeleteModalOpen"
    [isUpdateModalOpen]="isUpdateModalOpen"
    [selectedScheduleId]="selectedScheduleId"
    [deleteErrors]="deleteErrors"
    [updateErrors]="updateErrors"
    (deleteOne)="deleteOneSchedule($event)"
    (updateOne)="updateOneSchedule($event)"
    (deleteFollowing)="deleteScheduleFollowing($event)"
    (updateFollowing)="updateScheduleFollowing($event)"
    (closeDelete)="setScheduleActionModalState('delete', false, 0)"
    (closeUpdate)="setScheduleActionModalState('update', false, 0)"
></app-schedule-action-modal>

<app-today-schedule-list
    title="À faire aujourd'hui"
    emptyMessage="Tout est terminé pour aujourd'hui"
    [schedules]="schedulesToDoToday()"
    mode="todo"
    [getScheduleDisplay]="getScheduleDisplayForChild"
    (editScheduleRequested)="setModifySchedule($event)"
    (completeScheduleRequested)="completeSchedule($event.id, $event.completed)"
    (deleteScheduleRequested)="!$event.seriesId ? deleteOneSchedule($event.id) : setScheduleActionModalState('delete', true, $event.id)"
></app-today-schedule-list>

<app-today-schedule-list
    title="Complétées aujourd'hui"
    emptyMessage="Aucune tâche complétée aujourd'hui"
    [schedules]="schedulesCompleted()"
    mode="completed"
    [getScheduleDisplay]="getScheduleDisplayForChild"
    (completeScheduleRequested)="completeSchedule($event.id, $event.completed)"
></app-today-schedule-list>
