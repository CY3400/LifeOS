<section class="welcome-row">
    <div class="welcome-text">
        <h1>Bienvenue sur LifeOS</h1>
        <p>Organisez votre quotidien et suivez votre progression.</p>
    </div>
</section>

<app-kpi-summary
    [totalTasks]="totalTasks"
    [completedTasks]="completedTasks"
    [remainingTasks]="remainingTasks"
    [completionRate]="completionRate"
></app-kpi-summary>

<app-warning-modal
    [isWarningOpen]="isWarningOpen"
    [warningType]="warningType"
    [warningId]="warningId"
    [warningError]="warningError"
    [warningMessage]="warningMessage"
    [canSuggestArchive]="canSuggestArchive"
    (confirmDelete)="confirmWarningDelete(warningType!, warningId!)"
    (confirmArchive)="confirmWarningArchive(warningType!, warningId!)"
    (closeWarning)="toggleWarning(warningType!, false, null, '')"
></app-warning-modal>

<app-schedule-action-modal
    [isDeleteModalOpen]="isDeleteModalOpen"
    [isUpdateModalOpen]="isUpdateModalOpen"
    [selectedScheduleId]="selectedScheduleId"
    [deleteErrors]="deleteErrors"
    [updateErrors]="updateErrors"
    (deleteOne)="deleteOneSchedule($event)"
    (updateOne)="updateOneSchedule($event)"
    (deleteFollowing)="deleteScheduleFollowing($event)"
    (updateFollowing)="updateScheduleFollowing($event)"
    (closeDelete)="setScheduleActionModalState('delete', false, 0)"
    (closeUpdate)="setScheduleActionModalState('update', false, 0)"
></app-schedule-action-modal>

<app-task-form-modal
    [isTaskModalOpen]="isTaskModalOpen"
    [taskErrors]="taskErrors"
    [modifyTaskId]="modifyTaskId"
    [taskSubmit]="taskSubmit"
    [taskTitle]="taskTitle"
    [taskDescription]="taskDescription"
    [selectedTaskCategoryId]="selectedTaskCategoryId"
    [selectedGoalId]="selectedGoalId"
    [goals]="goals"
    [categories]="categories"
    (saveTask)="saveTask()"
    (onTaskGoalChange)="onTaskGoalChange()"
    (onTaskCategoryChange)="onTaskCategoryChange()"
    (closeTaskModal)="setTaskModalState(false)"
    (taskTitleChange)="taskTitle = $event"
    (taskDescriptionChange)="taskDescription = $event"
    (selectedGoalIdChange)="selectedGoalId = $event"
    (selectedTaskCategoryIdChange)="selectedTaskCategoryId = $event"
></app-task-form-modal>

<app-schedule-form-modal
    [isScheduleModalOpen]="isScheduleModalOpen"
    [scheduleErrors]="scheduleErrors"
    [modifyScheduleId]="modifyScheduleId"
    [selectedTaskId]="selectedTaskId"
    [tasks]="tasks"
    [scheduleSubmit]="scheduleSubmit"
    [repeatSchedule]="repeatSchedule"
    [scheduleDate]="scheduleDate"
    [todayDate]="todayDate"
    [startDate]="startDate"
    [endDate]="endDate"
    [daysChosen]="daysChosen"
    [scheduleStartTime]="scheduleStartTime"
    [scheduleEndTime]="scheduleEndTime"
    [schedulePriority]="schedulePriority"
    (selectedTaskIdChange)="selectedTaskId = $event"
    (scheduleDateChange)="scheduleDate = $event"
    (startDateChange)="startDate = $event"
    (endDateChange)="endDate = $event"
    (scheduleStartTimeChange)="scheduleStartTime = $event"
    (scheduleEndTimeChange)="scheduleEndTime = $event"
    (schedulePriorityChange)="schedulePriority = $event"
    (saveSchedule)="saveSchedule()"
    (toggleRepeatSchedule)="toggleRepeatSchedule()"
    (toggleDay)="toggleDay($event)"
    (setScheduleModalState)="setScheduleModalState($event)"
></app-schedule-form-modal>

<app-goal-form-modal
    [isGoalModalOn]="isGoalModalOn"
    [goalErrors]="goalErrors"
    [modifyGoalId]="modifyGoalId"
    [goalSubmit]="goalSubmit"
    [goalTitle]="goalTitle"
    [goalCategoryId]="goalCategoryId"
    [categories]="categories"
    (goalTitleChange)="goalTitle = $event"
    (goalCategoryIdChange)="goalCategoryId = $event"
    (saveGoal)="saveGoal()"
    (closeGoalModal)="setGoalModalState(false)"
></app-goal-form-modal>

<app-objective-details-modal
    [isOpen]="isGoalTasksModalOn"
    [isLoading]="isGoalTasksLoading"
    [title]="selectedGoalTitle"
    [categoryTitle]="selectedGoalCategory"
    [goalProgress]="selectedGoalProgress"
    [tasks]="selectedGoalTasks"
    (closeGoalDetails)="closeGoalTasksModal()"
></app-objective-details-modal>

<section class="dashboard-row">
    <div class="calendar-card">
        <app-calendar-dashboard-card
            [viewDate]="viewDate"
            [view]="view"
            [calendarEvents]="calendarEvents"
            [locale]="locale"
            (createScheduleRequested)="setScheduleModalState(true)"
            (previousRequested)="goToPrevious()"
            (todayRequested)="goToToday()"
            (nextRequested)="goToNext()"
            (viewChangeRequested)="setView($event)"
            (selectedDayChangeRequested)="setSelectedDay($event)"
        ></app-calendar-dashboard-card>

        <app-selected-day-schedules
            [yesterdayDateString]="yesterdayDateString"
            [todayDateString]="todayDateString"
            [selectedDate]="selectedDate"
            [selectedDateSchedules]="selectedDateSchedules"
            [getScheduleDisplay]="getScheduleDisplayForChild"
            (completeSchedule)="completeSchedule($event.id, $event.completed)"
            (editScheduleRequested)="setModifySchedule($event)"
            (deleteScheduleRequested)="!$event.seriesId ? deleteOneSchedule($event.id) : setScheduleActionModalState('delete', true, $event.id)"
        ></app-selected-day-schedules>
    </div>

    <div class="dashboard-side">
        <app-task-card
            [taskSubmit]="taskSubmit"
            [taskSearch]="taskSearch"
            [taskCategorySearch]="taskCategorySearch"
            [categories]="categories"
            [taskGoalSearch]="taskGoalSearch"
            [goals]="goals"
            [tasks]="filteredTasks()"
            (taskSearchChange)="taskSearch = $event"
            (taskCategorySearchChange)="taskCategorySearch = $event"
            (taskGoalSearchChange)="taskGoalSearch = $event"
            (createTaskRequested)="setTaskModalState(true)"
            (editTaskRequested)="setModifyTask($event.id, $event.title, $event.description, $event.goalId, $event.categoryId)"
            (deleteTaskRequested)="toggleWarning('task', true, $event.id, $event.title)"
        ></app-task-card>

        <app-goal-card
            [goalSubmit]="goalSubmit"
            [goalSearch]="goalSearch"
            [goalCategorySearch]="goalCategorySearch"
            [categories]="categories"
            [goals]="filteredGoals()"
            [goalProgresses]="goalProgresses"
            (goalSearchChange)="goalSearch = $event"
            (goalCategorySearchChange)="goalCategorySearch = $event"
            (createGoalRequested)="openCreateGoalModal()"
            (setGoalToModify)="setGoalToModify($event.id, $event.title, $event.categoryId)"
            (deleteGoalRequested)="toggleWarning('goal', true, $event.id, $event.title)"
            (detailsRequested)="openGoalDetails($event)"
        ></app-goal-card>

        <app-category-card
            [categorySubmit]="categorySubmit"
            [newCategoryTitle]="newCategoryTitle"
            [categoryErrors]="categoryErrors"
            [categorySearch]="categorySearch"
            [modifyCategoryId]="modifyCategoryId"
            [modifyCategoryTitle]="modifyCategoryTitle"
            [categories]="filteredCategories()"
            (newCategoryTitleChange)="newCategoryTitle = $event"
            (categorySearchChange)="categorySearch = $event"
            (modifyCategoryTitleChange)="modifyCategoryTitle = $event"
            (submitCategory)="submitCategory()"
            (modifyCategory)="modifyCategory($event)"
            (setCategoryToModify)="setCategoryToModify($event.id, $event.title)"
            (deleteCategoryRequested)="toggleWarning('category', true, $event.id, $event.title)"
        ></app-category-card>
    </div>
</section>
